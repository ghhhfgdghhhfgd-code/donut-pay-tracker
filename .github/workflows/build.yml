name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.1"
            yarn: "1.21.1+build.3"
            loader: "0.16.5"
            fapi: "0.102.1+1.21.1"
            loom: "1.7-SNAPSHOT"
          - mc: "1.21.4"
            yarn: "1.21.4+build.8"
            loader: "0.16.10"
            fapi: "0.119.4+1.21.4"
            loom: "1.9-SNAPSHOT"
          - mc: "1.21.8"
            yarn: "1.21.8+build.1"
            loader: "0.17.2"
            fapi: "0.136.1+1.21.8"
            loom: "1.11-SNAPSHOT"
          - mc: "1.21.11"
            yarn: "1.21.11+build.3"
            loader: "0.17.3"
            fapi: "0.141.4+1.21.11"
            loom: "1.14-SNAPSHOT"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.mc }}
        run: >
          ./gradlew build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          -Pyarn_mappings=${{ matrix.yarn }}
          -Ploader_version=${{ matrix.loader }}
          -Pfabric_version=${{ matrix.fapi }}
          -Ploom_version=${{ matrix.loom }}
          -Pmod_version=1.0.0+mc${{ matrix.mc }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: donutpay-${{ matrix.mc }}
          path: build/libs/*.jar
